<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réveillon Pricing — Feriadões | Praia Digital</title><meta name="description" content="Precifique Réveillon, Carnaval e feriadões no litoral com multiplicadores inteligentes por antecedência."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#fdf0e3,#fdf7ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #c96a1b22}h1{color:#a85512;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #f2dcc4;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#c96a1b;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#fdf1e2;border-radius:12px;padding:1rem}table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:.6rem}td,th{padding:.4rem;border-bottom:1px solid #f2e0c8;text-align:left}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#c96a1b;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/diaria-dinamica">Diária Dinâmica</a> · <a href="https://praia.digital/calendario-demanda">Calendário de Demanda</a> · <a href="https://praia.digital/eventos-litoral">Eventos Litoral</a></nav><div class="card"><h1>🎆 Réveillon Pricing</h1><p>As 10 datas que pagam o ano. Precifique cada uma sem deixar dinheiro na mesa.</p><label>Diária normal de alta temporada (R$)</label><input id="d" type="number" value="600"><label>Data</label><select id="f"><option value="3.2">Réveillon (28/dez–2/jan)</option><option value="2.2">Carnaval</option><option value="1.6">Feriado prolongado nacional</option><option value="1.4">Feriado estadual/eminente</option></select><label>Antecedência da reserva</label><select id="a"><option value="1.15">60+ dias antes</option><option value="1" selected>30–60 dias</option><option value="0.85">Menos de 30 dias (últimas vagas)</option></select><label>Mínimo de noites</label><input id="n" type="number" value="4"><button onclick="calc()">Precificar</button><div id="res"></div></div><script>function calc(){const d=+document.getElementById('d').value,f=+document.getElementById('f').value,a=+document.getElementById('a').value,n=+document.getElementById('n').value;const diaria=Math.round(d*f*a),pacote=diaria*n;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>🌙 Diária sugerida: <b>R$ ${diaria.toLocaleString('pt-BR')}</b></p><p>📦 Pacote mínimo (${n} noites): <b>R$ ${pacote.toLocaleString('pt-BR')}</b></p><table><tr><th>Estratégia</th><th>Dica</th></tr><tr><td>Early bird</td><td>Abra a data 6 meses antes com +15% — quem planeja paga mais</td></tr><tr><td>Pacote fechado</td><td>Exija mínimo de noites e venda o pacote, não a diária</td></tr><tr><td>Last minute</td><td>Nos últimos 15 dias, aceite -15% só se ainda estiver vazio</td></tr></table><p style="margin-top:.8rem">💡 Veja o heatmap do ano inteiro no <a href="https://praia.digital/calendario-demanda">Calendário de Demanda</a> e o fino da precificação na <a href="https://praia.digital/diaria-dinamica">Diária Dinâmica</a>.</p>`}</script></body></html>
